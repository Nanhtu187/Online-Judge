version: '3.8'

# Extension fields for reuse
x-configs:
  backend-base: &backend-base
    image: golang:1.25
    working_dir: /app
    volumes:
      - .:/app
      - go_cache:/root/.cache/go-build
      - go_pkg:/go/pkg/mod
    env_file:
      - .env

  web-base: &web-base
    image: node:20-alpine
    working_dir: /app/src/apps/frontend
    volumes:
      - .:/app
      - node_modules:/app/src/apps/frontend/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    entrypoint: sh -c "corepack enable && yarn install && yarn dev --host 0.0.0.0"
    restart: always

services:
  # Infrastructure
  db:
    image: mysql:8.0
    restart: always
    env_file:
      - .env
    ports:
      - "${DATABASE_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql

  kafka:
    image: apache/kafka:latest
    env_file:
      - .env
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1

  # Backend Services
  iam:
    <<: *backend-base
    environment:
      - SERVICE_NAME=iam
      - DATABASE__HOST=db
      - SERVER__HTTP_HOST=localhost
      - SERVER__HTTP_PORT=8080
      - SERVER__GRPC_HOST=localhost
      - SERVER__GRPC_PORT=50050
    entrypoint: sh -c "go run src/apps/backend/iam/cmd/main.go migrate up && go run src/apps/backend/iam/cmd/main.go start"
    ports:
      - "${SERVER__HTTP_PORT:-8080}:${SERVER__HTTP_PORT:-8080}"
      - "${SERVER__GRPC_PORT:-50050}:${SERVER__GRPC_PORT:-50050}"
    depends_on:
      - db

  server:
    <<: *backend-base
    environment:
      - SERVICE_NAME=server
      - DATABASE__HOST=db
      - SERVER__HTTP_HOST=localhost
      - SERVER__HTTP_PORT=8081
      - SERVER__GRPC_HOST=localhost
      - SERVER__GRPC_PORT=50051
    entrypoint: sh -c "go run src/apps/backend/server/cmd/main.go migrate up && go run src/apps/backend/server/cmd/main.go start"
    ports:
      - "${SERVER__HTTP_PORT:-8081}:${SERVER__HTTP_PORT:-8081}"
      - "${SERVER__GRPC_PORT:-50051}:${SERVER__GRPC_PORT:-50051}"
    depends_on:
      - db
      - kafka

  result-consumer:
    <<: *backend-base
    environment:
      - SERVICE_NAME=result-consumer
      - DATABASE__HOST=db
      - SERVER__HTTP_HOST=localhost
      - SERVER__HTTP_PORT=8083
      - SERVER__GRPC_HOST=localhost
      - SERVER__GRPC_PORT=50053
    entrypoint: ["go", "run", "src/apps/backend/server/cmd/main.go", "result-consumer"]
    depends_on:
      - db
      - kafka

  judger:
    <<: *backend-base
    environment:
      - SERVICE_NAME=judger
      - DATABASE__HOST=db
      - SERVER__HTTP_HOST=localhost
      - SERVER__HTTP_PORT=8082
      - SERVER__GRPC_HOST=localhost
      - SERVER__GRPC_PORT=50052
      - SERVER_ENDPOINT=server:50051
    volumes:
      - .:/app
      - go_cache:/root/.cache/go-build
      - go_pkg:/go/pkg/mod
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["go", "run", "src/apps/backend/runner/cmd/main.go", "judger"]
    depends_on:
      - db
      - kafka
      - server

  # Web Service
  frontend:
    <<: *web-base
    ports:
      - "${FRONTEND_EXTERNAL_PORT:-3000}:5173"
    depends_on:
      - iam
      - server

volumes:
  db_data:
  go_cache:
  go_pkg:
  node_modules:
